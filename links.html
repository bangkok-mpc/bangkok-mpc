<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามเรา — Bangkok Modern Pentathlon Club</title>
<meta name="description" content="ช่องทางโซเชียลมีเดียของชมรมปัญจกีฬากรุงเทพมหานคร">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2549;--navy-2:#13335f;--red:#B80606;--gold:#B8760F;--gold-2:#D4943A;--muted:#66728a}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--navy);line-height:1.5;-webkit-text-size-adjust:100%;
  min-height:100vh;min-height:100dvh;
  background:linear-gradient(180deg,#fff 0%,#eef1f7 100%);
  display:flex;justify-content:center;
}
.wrap{width:100%;max-width:440px;padding:28px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.logo{width:210px;max-width:62%;height:auto;display:block}
h1{margin:14px 0 4px;font-size:22px;font-weight:700;text-align:center}
.sub{margin:0 0 22px;color:var(--muted);font-size:14px;text-align:center}
.rule{width:64px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2));margin:0 0 22px}
.links{width:100%;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.link{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 18px;border-radius:16px;text-decoration:none;
  background:var(--navy);color:#fff;
  border:2px solid transparent;border-left:6px solid var(--gold);
  box-shadow:0 6px 18px rgba(10,37,73,.18);
  transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
}
.link:hover,.link:focus-visible{background:var(--navy-2);transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,37,73,.24);outline:none}
.link:focus-visible{border-color:var(--gold-2)}
.link:active{transform:translateY(0)}
.badge{
  flex:none;width:44px;height:44px;border-radius:12px;
  background:#fff;color:var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;letter-spacing:.02em;
  border-bottom:3px solid var(--red);
}
.badge img{width:28px;height:28px;object-fit:contain;display:block}
.txt{flex:1;min-width:0}
.name{display:block;font-size:17px;font-weight:600}
.handle{display:block;font-size:13px;color:#c9d3e6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{flex:none;color:var(--gold-2)}
.foot{margin-top:30px;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.foot b{color:var(--gold);font-weight:700}
</style>
</head>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangkok Modern Pentathlon Club — สมาชิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2549; --navy-2:#13335f; --red:#B80606; --gold:#B8760F; --gold-2:#D4943A;
  --bg:#F5F6F9; --card:#fff; --text:#14213a; --muted:#66728a; --line:#E3E7EF;
  --ok:#1f7a4d; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
.hidden{display:none!important}

/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(180deg,#fff 0%,#eef1f7 100%)}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:20px;box-shadow:0 10px 40px rgba(10,37,73,.12);padding:28px 24px;border-top:5px solid var(--gold)}
.auth-logo{display:block;margin:0 auto 8px;width:170px;height:auto}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}
input[type=time]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}
/* iOS Safari: stop date/time inputs from using their own width, centering and collapsed height */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left;font-family:inherit;font-size:16px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.4em;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{opacity:.6}
@supports (-webkit-touch-callout:none){input[type=time]:invalid::before{content:'เลือกเวลา';color:#8a93a6}input[type=time]:invalid:focus::before{content:''}}
input,select{max-width:100%}
input:focus,select:focus{border-color:var(--gold)}
/* aligned form grid (12 cols desktop, 2 cols mobile) */
.fgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.fgrid>div{min-width:0}
.fgrid label{margin:0 0 6px}
.fgrid input,.fgrid select{height:46px;box-sizing:border-box}
.fgrid .c3{grid-column:span 3}.fgrid .c4{grid-column:span 4}.fgrid .c6{grid-column:span 6}.fgrid .c12{grid-column:1/-1}
.fgrid .btn{width:100%;height:46px}
.fgrid .hint{display:block;margin-top:5px;font-size:12px;line-height:1.3;color:var(--muted)}
@media(max-width:699px){.fgrid .sp{display:none}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid .c3,.fgrid .c4,.fgrid .c6{grid-column:span 1}.fgrid .fm{grid-column:1/-1}}
.nw{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.08em}
.ticket{position:relative;background:#fff;border:1.5px dashed var(--gold);border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:10px}
.ticket h4{margin:0 0 2px;font-size:16px;color:var(--navy)}
.ticket p{margin:2px 0;font-size:14px;color:var(--text)}
.ticket small{color:var(--muted);display:block;margin-top:6px}
.otp-input{text-align:center;font-size:26px;letter-spacing:.35em;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%;margin-top:18px}
.btn.gold{background:var(--gold)} .btn.gold:hover{background:#9c640b}
.btn.red{background:var(--red)} .btn.red:hover{background:#960505}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.link{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer;padding:0}
.note{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}

/* app shell */
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top-in img{height:40px;width:auto}
.brand{font-weight:700;line-height:1.15;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--gold-2);font-size:11px;letter-spacing:.08em}
.spacer{flex:1}
.who{font-size:13px;text-align:right;line-height:1.2}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em}
.badge.coach{background:var(--gold);color:#fff}
.badge.student{background:#dfe7f5;color:var(--navy)}
.badge.off{background:#f3d6d6;color:var(--red)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:15;overflow-x:auto;white-space:nowrap}
nav.tabs .in{max-width:1080px;margin:0 auto;padding:0 8px;display:flex}
nav.tabs button{border:0;background:none;padding:13px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--red)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ov2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:699px){.ov2{grid-template-columns:minmax(0,1fr)}}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.stat{border-left:4px solid var(--gold)}
.stat .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;border:3px solid var(--gold);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.pinfo h2{margin:0;font-size:20px;color:var(--navy)}
.pinfo div{font-size:14px;color:var(--muted)}
.chart-box{position:relative;height:260px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
tr.me{background:#fff6e5}
.tbl-wrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
.rank-no{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:var(--bg);font-weight:700;color:var(--navy);font-size:13px}
.rank-no.r1{background:var(--gold);color:#fff}.rank-no.r2{background:#9aa5b8;color:#fff}.rank-no.r3{background:#a8693a;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:140px}
.row input,.row select{min-width:0}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-title h2{margin:0;font-size:18px;color:var(--navy)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,37,73,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:20px}}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal-h h3{margin:0;color:var(--navy);font-size:18px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.checklist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.checklist label{display:flex;gap:10px;align-items:center;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500;color:var(--text);font-size:14px}
.checklist input{width:18px;height:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-size:14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--red)}
.spinner{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>

/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' }) : '-';
const initial = p => (p.nickname || p.full_name || '?').trim().charAt(0).toUpperCase();
const nameOf = p => p.nickname ? `${p.full_name} (${p.nickname})` : (p.full_name || '(ไม่ระบุชื่อ)');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const hm = t => t ? String(t).slice(0, 5) : '';
// check-in window opens 30 min before start (must match public.self_check_in)
const opensAt = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); const x = h * 60 + m - 30; return x < 0 ? '00:00' : `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
const timeRange = a => a.start_time ? `${hm(a.start_time)}${a.end_time ? '–' + hm(a.end_time) : ''} น.` : 'ทั้งวัน';
// UIPM rule 1.2.2: age = competition year - birth year (months/days ignored)
function ageGroup(bd, year = new Date().getFullYear()) {
  if (!bd) return null;
  const age = year - Number(String(bd).slice(0, 4));
  if (!(age >= 0)) return null;
  if (age <= 8) return 'U9';
  if (age <= 10) return 'U11';
  if (age <= 12) return 'U13';
  if (age <= 14) return 'U15';
  if (age <= 16) return 'U17';
  if (age <= 18) return 'U19';
  if (age <= 21) return 'Junior';
  return 'Senior';
}
const AGE_GROUPS = ['U9', 'U11', 'U13', 'U15', 'U17', 'U19', 'Junior', 'Senior'];
let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 3500);
}
function fail(e, fallback = 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง') {
  console.error(e); toast((e && e.message) ? e.message : fallback, true);
}
let charts = [];
function killCharts() { charts.forEach(c => c.destroy()); charts = []; }
function mkChart(canvas, cfg) { const c = new Chart(canvas, cfg); charts.push(c); return c; }
function avatarHtml(p) {
  return p.avatar_url ? `<div class="avatar"><img src="${esc(p.avatar_url)}" alt=""></div>` : `<div class="avatar">${esc(initial(p))}</div>`;
}
function openModal(title, html) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-close aria-label="ปิด">×</button></div><div class="body">${html}</div></div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.hasAttribute('data-close')) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
async function busy(btn, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'กำลังทำงาน…';
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}

/* ============ auth ============ */
const auth = { mode: 'signup', step: 'form', email: '', cooldown: 0, timer: null, pendingPassword: false, user: null };

function renderAuth() {
  killCharts();
  const root = $('#root');
  const m = auth.mode;
  let inner;
  if (auth.step === 'setpw') {
    inner = `
      <p class="auth-sub">${m === 'reset' ? 'ตั้งรหัสผ่านใหม่' : 'ยืนยันอีเมลสำเร็จ 🎉<br>ตั้งรหัสผ่านสำหรับเข้าสู่ระบบครั้งต่อไป'}</p>
      <form id="f-pw">
        <label for="a-pw">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
        <input id="a-pw" type="password" minlength="8" required autocomplete="new-password">
        <label for="a-pw2">ยืนยันรหัสผ่าน</label>
        <input id="a-pw2" type="password" minlength="8" required autocomplete="new-password">
        <button class="btn block" type="submit">บันทึกและเข้าสู่ระบบ</button>
      </form>`;
  } else if (auth.step === 'otp') {
    inner = `
      <p class="auth-sub">กรอกรหัส OTP ที่ส่งไปที่<br><b>${esc(auth.email)}</b></p>
      <form id="f-otp">
        <input id="a-otp" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required autofocus>
        <button class="btn block" type="submit">ยืนยัน</button>
      </form>
      <p class="note">
        <button class="link" id="resend" ${auth.cooldown > 0 ? 'disabled' : ''}>${auth.cooldown > 0 ? `ส่งรหัสอีกครั้งใน ${auth.cooldown} วิ` : 'ส่งรหัสอีกครั้ง'}</button>
        · <button class="link" id="back">เปลี่ยนอีเมล</button>
      </p>`;
  } else if (m === 'reset') {
    inner = `
      <p class="auth-sub">ตั้งรหัสผ่านใหม่ / ยังไม่เคยตั้งรหัสผ่าน<br>เราจะส่งรหัส OTP ไปที่อีเมลเพื่อยืนยันตัวตน</p>
      <form id="f-email">
        <label for="a-email">อีเมล</label>
        <input id="a-email" type="email" required autocomplete="email" inputmode="email" value="${esc(auth.email)}">
        <button class="btn block" type="submit">ส่งรหัส OTP</button>
      </form>
      <p class="note"><button class="link" data-mode="login">← กลับไปเข้าสู่ระบบ</button></p>`;
  } else {
    const isSignup = m === 'signup';
    inner = `
      <p class="auth-sub">${isSignup ? 'สมัครสมาชิกชมรม' : 'เข้าสู่ระบบสมาชิก'}</p>
      <div class="seg">
        <button data-mode="signup" class="${isSignup ? 'on' : ''}">สมัครสมาชิก</button>
        <button data-mode="login" class="${!isSignup ? 'on' : ''}">เข้าสู่ระบบ</button>
      </div>
      <form id="${isSignup ? 'f-email' : 'f-login'}" autocomplete="on">
        ${isSignup ? `
          <label for="a-name">ชื่อ-นามสกุล</label><input id="a-name" type="text" required maxlength="100" autocomplete="name">
          <label for="a-nick">ชื่อเล่น</label><input id="a-nick" type="text" required maxlength="40">
          <label for="a-phone">เบอร์โทร</label><input id="a-phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel">
          <label for="a-bd">วัน/เดือน/ปีเกิด</label><input id="a-bd" type="date" required min="1930-01-01" max="${today()}" autocomplete="bday">` : ''}
        <label for="a-email">อีเมล</label><input id="a-email" type="email" required autocomplete="email" inputmode="email" value="${esc(auth.email)}">
        ${isSignup ? '' : `<label for="a-pass">รหัสผ่าน</label><input id="a-pass" type="password" required autocomplete="current-password">`}
        <button class="btn block" type="submit">${isSignup ? 'ส่งรหัส OTP ไปที่อีเมล' : 'เข้าสู่ระบบ'}</button>
      </form>
      ${isSignup
        ? '<p class="note">ยืนยันอีเมลด้วย OTP ครั้งเดียว แล้วตั้งรหัสผ่านไว้ใช้ครั้งต่อไป</p>'
        : '<p class="note"><button class="link" data-mode="reset">ลืมรหัสผ่าน / ยังไม่ได้ตั้งรหัสผ่าน?</button></p>'}`;
  }
  root.innerHTML = `<div class="auth-wrap"><div class="auth-card"><img class="auth-logo" src="${LOGO}" alt="Bangkok Modern Pentathlon Club">${inner}</div></div>`;

  root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    const e = $('#a-email'); if (e) auth.email = e.value.trim();
    auth.mode = b.dataset.mode; auth.step = 'form'; renderAuth();
  });

  const fe = $('#f-email');
  if (fe) fe.onsubmit = async e => {
    e.preventDefault();
    const email = $('#a-email').value.trim().toLowerCase();
    const meta = m === 'signup' ? { full_name: $('#a-name').value.trim(), nickname: $('#a-nick').value.trim(), phone: $('#a-phone').value.trim(), birth_date: $('#a-bd').value } : undefined;
    await busy(fe.querySelector('button[type=submit]'), async () => {
      try { await sendOtp(email, meta); auth.email = email; auth.step = 'otp'; startCooldown(); renderAuth(); }
      catch (err) { fail(err); }
    });
  };

  const fl = $('#f-login');
  if (fl) fl.onsubmit = async e => {
    e.preventDefault();
    const email = $('#a-email').value.trim().toLowerCase(); auth.email = email;
    await busy(fl.querySelector('button[type=submit]'), async () => {
      const { error } = await sb.auth.signInWithPassword({ email, password: $('#a-pass').value });
      if (error) toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง (ถ้ายังไม่เคยตั้งรหัสผ่าน กด “ลืมรหัสผ่าน”)', true);
    });
  };

  const fo = $('#f-otp');
  if (fo) {
    fo.onsubmit = async e => {
      e.preventDefault();
      await busy(fo.querySelector('button[type=submit]'), async () => {
        auth.pendingPassword = true; // after OTP, always go through "set password"
        const { error } = await sb.auth.verifyOtp({ email: auth.email, token: $('#a-otp').value.trim(), type: 'email' });
        if (error) { auth.pendingPassword = false; toast('รหัสไม่ถูกต้องหรือหมดอายุ', true); }
      });
    };
    $('#resend').onclick = async () => {
      try { await sendOtp(auth.email, undefined); toast('ส่งรหัสใหม่แล้ว'); startCooldown(); } catch (err) { fail(err); }
    };
    $('#back').onclick = () => { auth.step = 'form'; renderAuth(); };
  }

  const fp = $('#f-pw');
  if (fp) fp.onsubmit = async e => {
    e.preventDefault();
    const pw = $('#a-pw').value;
    if (pw.length < 8) return toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', true);
    if (pw !== $('#a-pw2').value) return toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน', true);
    await busy(fp.querySelector('button[type=submit]'), async () => {
      const { data, error } = await sb.auth.updateUser({ password: pw, data: { password_set: true } });
      if (error) return fail(error);
      auth.pendingPassword = false; auth.step = 'form'; auth.mode = 'login';
      toast('ตั้งรหัสผ่านแล้ว');
      boot(data.user);
    });
  };
}
async function sendOtp(email, meta) {
  const options = { shouldCreateUser: auth.mode === 'signup' };
  if (meta) options.data = meta;
  const { error } = await sb.auth.signInWithOtp({ email, options });
  if (error) {
    if (!options.shouldCreateUser && /not allowed|signups|not found/i.test(error.message)) throw new Error('ไม่พบอีเมลนี้ในระบบ กรุณาสมัครสมาชิกก่อน');
    throw error;
  }
}
function startCooldown() {
  auth.cooldown = 60; clearInterval(auth.timer);
  auth.timer = setInterval(() => {
    auth.cooldown--;
    const b = $('#resend');
    if (b) { b.disabled = auth.cooldown > 0; b.textContent = auth.cooldown > 0 ? `ส่งรหัสอีกครั้งใน ${auth.cooldown} วิ` : 'ส่งรหัสอีกครั้ง'; }
    if (auth.cooldown <= 0) clearInterval(auth.timer);
  }, 1000);
}

/* ============ boot ============ */
sb.auth.onAuthStateChange((evt, session) => {
  // do not await supabase calls inside this callback
  setTimeout(() => {
    if (evt === 'USER_UPDATED') return;
    if (!session) { me = null; auth.step = 'form'; auth.pendingPassword = false; renderAuth(); return; }
    if (me && me.id === session.user.id) return;
    if (auth.step === 'setpw' && auth.user && auth.user.id === session.user.id) return;
    enter(session.user);
  }, 0);
});
function enter(user) {
  const hasPw = !!(user.user_metadata && user.user_metadata.password_set);
  if (auth.pendingPassword || !hasPw) { auth.user = user; auth.step = 'setpw'; renderAuth(); return; }
  auth.step = 'form'; boot(user);
}
async function boot(user) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !data) { fail(error || new Error('ไม่พบโปรไฟล์'), 'โหลดโปรไฟล์ไม่สำเร็จ'); await sb.auth.signOut(); return; }
  if (!data.is_active) { toast('บัญชีนี้ถูกปิดการใช้งาน กรุณาติดต่อโค้ช', true); await sb.auth.signOut(); return; }
  me = data; tab = data.role === 'coach' ? 'overview' : 'profile'; renderApp();
}

const localDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
async function fetchAll(make) {           // PostgREST caps a response at 1000 rows, so page through
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await make().range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) return all;
    from += 1000;
  }
}

function readCoupon(p, root = document, withCode = false) {
  const val = id => $(`#${p}-${id}`, root).value.trim();
  const max = val('max');
  const f = { title: val('title'), description: val('desc') || null, expires_at: val('exp') || null, max_uses: max ? Number(max) : null };
  if (max && (!Number.isInteger(f.max_uses) || f.max_uses < 1)) { toast('จำนวนสิทธิ์ต้องเป็นจำนวนเต็มตั้งแต่ 1', true); return null; }
  if (withCode) {
    const code = val('code').toUpperCase();
    if (code && !/^[A-Z0-9]{4,20}$/.test(code)) { toast('โค้ดใช้ได้เฉพาะ A-Z และ 0-9 ยาว 4-20 ตัว', true); return null; }
    f.code = code || null;
  }
  return f;
}

      ${acts.data.length ? `<div class="tbl-wrap"><table><thead><tr><th>กิจกรรมวันนี้</th><th>เวลา</th><th>สถานะ</th></tr></thead><tbody>${acts.data.map(a => `<tr><td>${esc(a.title)}${a.location ? `<br><small style="color:var(--muted)">${esc(a.location)}</small>` : ''}</td><td>${timeRange(a)}${a.start_time ? `<br><small style="color:var(--muted)">เปิดเช็คชื่อ ${opensAt(a.start_time)} น.</small>` : ''}</td><td>${done.has(a.id) ? '<span class="badge student">เข้าร่วมแล้ว ✓</span>' : '<span style="color:var(--muted)">ยังไม่ได้เช็คชื่อ</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">วันนี้ยังไม่มีกิจกรรม</div>'}
      <form id="ci-form" style="margin-top:14px">
        <label>รหัสเช็คชื่อ (ขอจากโค้ชหน้างาน)</label>
        <div style="display:flex;gap:8px">
          <input id="ci-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 หลัก" autocomplete="off" required style="flex:1;font-size:20px;letter-spacing:6px;text-align:center">
          <button class="btn gold" type="submit">เช็คชื่อ</button>
        </div>
      </form>
    </div>`;
  const MSG = {
    wrong_code: r => `รหัสไม่ถูกต้อง (เหลืออีก ${r.left} ครั้งก่อนถูกล็อกชั่วคราว)`,
    locked: () => 'กรอกรหัสผิดหลายครั้ง กรุณารอ 10 นาทีแล้วลองใหม่',
    too_early: r => `ยังไม่ถึงเวลาเช็คชื่อ "${r.title}"`,
    closed: r => `"${r.title}" ปิดการเช็คชื่อแล้ว กรุณาแจ้งโค้ช`,
    not_member: () => 'บัญชีนี้เช็คชื่อด้วยตัวเองไม่ได้',
    auth: () => 'กรุณาเข้าสู่ระบบใหม่'
  };
  $('#ci-form', el).onsubmit = async e => {
    e.preventDefault();
    await busy(e.target.querySelector('button'), async () => {
      const { data, error } = await sb.rpc('self_check_in', { p_code: $('#ci-code', el).value });
      if (error) return fail(error);
      if (data.ok) { toast(data.reason === 'already' ? `เช็คชื่อ "${data.title}" ไว้แล้ว` : `เช็คชื่อ "${data.title}" สำเร็จ ✓`); return renderApp(); }
      toast((MSG[data.reason] || (() => 'เช็คชื่อไม่สำเร็จ'))(data), true);

function editProfileModal() {
  const ov = openModal('แก้ไขโปรไฟล์', `
    <div style="display:flex;gap:14px;align-items:center;margin:10px 0">
      <div id="av-prev">${avatarHtml(me)}</div>
      <div><input id="p-file" type="file" accept="image/png,image/jpeg,image/webp"><div class="note" style="text-align:left;margin-top:4px">รูปไม่เกิน 2 MB</div></div>
    </div>
    <form id="p-form">
      <label>ชื่อ-นามสกุล</label><input id="p-name" type="text" required maxlength="100" value="${esc(me.full_name)}">
      <label>ชื่อเล่น</label><input id="p-nick" type="text" maxlength="40" value="${esc(me.nickname)}">
      <label>เบอร์โทร</label><input id="p-phone" type="tel" maxlength="20" value="${esc(me.phone || '')}">
      <label>วันเกิด</label><input id="p-bd" type="date" value="${esc(me.birth_date || '')}">
      <button class="btn block" type="submit">บันทึก</button>
    </form>`);
  $('#p-file', ov).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast('รองรับเฉพาะไฟล์ PNG, JPG, WEBP', true);
    if (f.size > 2 * 1024 * 1024) return toast('ไฟล์ใหญ่เกิน 2 MB', true);
    try {
      const ext = f.type === 'image/png' ? 'png' : f.type === 'image/webp' ? 'webp' : 'jpg';
      const path = `${me.id}/avatar-${Date.now()}.${ext}`;
      const up = await sb.storage.from('avatars').upload(path, f, { contentType: f.type, upsert: true });
      if (up.error) throw up.error;
      const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      const { error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
      if (error) throw error;
      me.avatar_url = url; $('#av-prev', ov).innerHTML = avatarHtml(me); toast('อัปเดตรูปแล้ว');
    } catch (err) { fail(err); }
  };
  $('#p-form', ov).onsubmit = async e => {
    e.preventDefault();
    await busy(e.target.querySelector('button[type=submit]'), async () => {
      const patch = { full_name: $('#p-name', ov).value.trim(), nickname: $('#p-nick', ov).value.trim(), phone: $('#p-phone', ov).value.trim() || null, birth_date: $('#p-bd', ov).value || null };
      const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
      if (error) return fail(error);
      Object.assign(me, patch); ov.remove(); toast('บันทึกแล้ว'); renderApp();
    });
  };
}

/* ============ student stats (reused by coach "view member") ============ */
async function renderStats(el, memberId) {
  el.innerHTML = '<div class="spinner">กำลังโหลดสถิติ…</div>';
  const [att, res, rk] = await Promise.all([
    sb.from('attendance').select('created_at, activity:activities(title, activity_date, discipline)').eq('member_id', memberId),
    sb.from('results').select('discipline, placement, score, points, competition:competitions(name, competition_date)').eq('member_id', memberId),
    sb.rpc('club_ranking', { p_year: null })
  ]);
  if (att.error) throw att.error; if (res.error) throw res.error; if (rk.error) throw rk.error;

  const acts = att.data.filter(a => a.activity).sort((a, b) => a.activity.activity_date.localeCompare(b.activity.activity_date));
  const overall = res.data.filter(r => r.discipline === 'overall' && r.competition).sort((a, b) => a.competition.competition_date.localeCompare(b.competition.competition_date));
  const ym = today().slice(0, 7);
  const thisMonth = acts.filter(a => a.activity.activity_date.startsWith(ym)).length;
  const myRank = rk.data.find(r => r.member_id === memberId);

  // last 6 months buckets
  const buckets = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: `${MONTHS[d.getMonth()]} ${String(d.getFullYear() + 543).slice(2)}`, n: 0 });
  }
  acts.forEach(a => { const b = buckets.find(x => x.key === a.activity.activity_date.slice(0, 7)); if (b) b.n++; });

  el.innerHTML = `
    <div class="section-title"><h2>สถิติและพัฒนาการ</h2></div>
    <div class="grid g4">
      <div class="card stat"><div class="v">${acts.length}</div><div class="l">เข้ากิจกรรมทั้งหมด (ครั้ง)</div></div>
      <div class="card stat"><div class="v">${thisMonth}</div><div class="l">เข้ากิจกรรมเดือนนี้</div></div>
      <div class="card stat"><div class="v">${overall.length}</div><div class="l">รายการแข่งที่ลงสนาม</div></div>
      <div class="card stat"><div class="v">${myRank ? '#' + myRank.rank : '-'}</div><div class="l">อันดับในชมรม${myRank ? ` · ${myRank.total_points} คะแนน` : ''}</div></div>
    </div>
    <div class="grid g2 ov2" style="margin-top:14px">
      <div class="card"><h3>การเข้ากิจกรรมรายเดือน (6 เดือนล่าสุด)</h3><div class="chart-box"><canvas id="c-att"></canvas></div></div>
      <div class="card"><h3>แนวโน้มคะแนนสะสมรายรายการแข่ง</h3>${overall.length ? '<div class="chart-box"><canvas id="c-pts"></canvas></div>' : '<div class="empty">ยังไม่มีผลการแข่งขัน</div>'}</div>
      <div class="card"><h3>แนวโน้มอันดับในแต่ละรายการ</h3>${overall.some(r => r.placement) ? '<div class="chart-box"><canvas id="c-plc"></canvas></div>' : '<div class="empty">ยังไม่มีข้อมูลอันดับ</div>'}</div>
      <div class="card"><h3>ผลรายประเภทกีฬา (คะแนนเฉลี่ย)</h3>${res.data.some(r => r.discipline !== 'overall' && r.score != null) ? '<div class="chart-box"><canvas id="c-dis"></canvas></div>' : '<div class="empty">ยังไม่มีผลรายประเภท</div>'}</div>
    </div>
    <div class="card" style="margin-top:14px"><h3>ประวัติผลการแข่งขัน</h3>${resultsTable(res.data)}</div>
    <div class="card" style="margin-top:14px"><h3>ประวัติเข้ากิจกรรมล่าสุด</h3>${acts.length ? `<div class="tbl-wrap"><table><thead><tr><th>วันที่</th><th>กิจกรรม</th><th>ประเภท</th></tr></thead><tbody>${acts.slice(-10).reverse().map(a => `<tr><td>${fmtDate(a.activity.activity_date)}</td><td>${esc(a.activity.title)}</td><td>${esc(a.activity.discipline || '-')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">ยังไม่มีประวัติ</div>'}</div>`;

  const lab = (fmt) => ({ display: true, color: C.navy, anchor: 'end', align: 'top', font: { weight: '600' }, formatter: fmt || (v => v) });
  mkChart($('#c-att', el), { type: 'bar',
    data: { labels: buckets.map(b => b.label), datasets: [{ label: 'จำนวนครั้ง', data: buckets.map(b => b.n), backgroundColor: C.gold, borderRadius: 6 }] },
    options: { maintainAspectRatio: false, layout: { padding: { top: 18 } }, plugins: { legend: { display: false }, datalabels: lab() },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: C.grid }, title: { display: true, text: 'ครั้ง' } }, x: { grid: { display: false } } } } });

  if (overall.length) {
    const labels = overall.map(r => r.competition.name.length > 14 ? r.competition.name.slice(0, 13) + '…' : r.competition.name);
    let cum = 0; const cumData = overall.map(r => (cum += Number(r.points)));
    mkChart($('#c-pts', el), { type: 'line',
      data: { labels, datasets: [
        { label: 'คะแนนสะสม', data: cumData, borderColor: C.navy, backgroundColor: C.navy, tension: .25, pointRadius: 5 },
        { label: 'คะแนนรายการ', data: overall.map(r => Number(r.points)), borderColor: C.gold, backgroundColor: C.gold, borderDash: [5, 4], tension: .25, pointRadius: 4 }] },
      options: { maintainAspectRatio: false, layout: { padding: { top: 20 } }, plugins: { legend: { position: 'bottom' }, datalabels: { display: true, align: 'top', font: { weight: '600' }, color: ctx => ctx.datasetIndex ? C.gold : C.navy } },
        scales: { y: { beginAtZero: true, grid: { color: C.grid }, title: { display: true, text: 'คะแนน' } }, x: { grid: { display: false } } } } });
    if ($('#c-plc', el)) {
      const pl = overall.filter(r => r.placement);
      mkChart($('#c-plc', el), { type: 'line',
        data: { labels: pl.map(r => r.competition.name.length > 14 ? r.competition.name.slice(0, 13) + '…' : r.competition.name), datasets: [{ label: 'อันดับ', data: pl.map(r => r.placement), borderColor: C.red, backgroundColor: C.red, tension: .25, pointRadius: 5 }] },

const ACTIVITY_TYPES = ['ฟันดาบ', 'ว่ายน้ำ', 'ขี่ม้า', 'เลเซอร์รัน', 'ฟิตเนส/วิ่ง'];
// shared field grid for create + edit; p = id prefix
function activityFields(p, a = {}) {
  const dis = a.discipline && !ACTIVITY_TYPES.includes(a.discipline) ? [...ACTIVITY_TYPES, a.discipline] : ACTIVITY_TYPES;
  return `

    <div class="c3"><label for="${p}-st">เวลาเริ่ม</label><input id="${p}-st" type="time" required value="${esc(hm(a.start_time))}"></div>

    <div class="c3 fm"><label for="${p}-dis">ประเภท</label><select id="${p}-dis"><option value="">ทั่วไป</option>${dis.map(x => `<option ${x === a.discipline ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>`;
}
function readActivity(p, root = document) {
  const st = $(`#${p}-st`, root).value, et = $(`#${p}-et`, root).value;
  if (et <= st) { toast('เวลาจบต้องหลังเวลาเริ่ม', true); return null; }
  return { title: $(`#${p}-title`, root).value.trim(), activity_date: $(`#${p}-date`, root).value, start_time: st, end_time: et, location: $(`#${p}-loc`, root).value.trim() || null, discipline: $(`#${p}-dis`, root).value || null };
}

async function checkInModal(act) {
  const [m, cur] = await Promise.all([
    sb.from('profiles').select('id, full_name, nickname').eq('role', 'student').eq('is_active', true).order('full_name'),
    sb.from('attendance').select('member_id').eq('activity_id', act.id)
  ]);
  if (m.error) return fail(m.error); if (cur.error) return fail(cur.error);
  const have = new Set(cur.data.map(x => x.member_id));
  const ov = openModal(`เช็คชื่อ: ${act.title}`, `
    <div class="note" style="text-align:left">${fmtDate(act.activity_date)} · เลือกสมาชิกที่เข้าร่วม</div>
    <input id="ck-q" type="text" placeholder="ค้นหา" style="margin-top:8px">
    <div class="checklist" id="ck-list">${m.data.map(p => `<label data-n="${esc(nameOf(p).toLowerCase())}"><input type="checkbox" value="${p.id}" ${have.has(p.id) ? 'checked' : ''}>${esc(nameOf(p))}</label>`).join('') || '<div class="empty">ยังไม่มีสมาชิก</div>'}</div>
    <button class="btn block" id="ck-save">บันทึกการเช็คชื่อ</button>`);
  $('#ck-q', ov).oninput = e => { const q = e.target.value.trim().toLowerCase(); ov.querySelectorAll('#ck-list label').forEach(l => l.classList.toggle('hidden', !!q && !l.dataset.n.includes(q))); };
  $('#ck-save', ov).onclick = ev => busy(ev.target, async () => {
    const checked = new Set([...ov.querySelectorAll('#ck-list input:checked')].map(i => i.value));
    const add = [...checked].filter(id => !have.has(id)).map(id => ({ activity_id: act.id, member_id: id, checked_in_by: me.id }));
    const rem = [...have].filter(id => !checked.has(id));
    if (add.length) { const { error } = await sb.from('attendance').insert(add); if (error) return fail(error); }
    if (rem.length) { const { error } = await sb.from('attendance').delete().eq('activity_id', act.id).in('member_id', rem); if (error) return fail(error); }
    ov.remove(); toast('บันทึกแล้ว'); renderApp();
  });
}

    <div class="section-title"><h2>รายการแข่งขัน</h2></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>วันที่</th><th>รายการ</th><th>ระดับ</th><th></th></tr></thead><tbody>
    ${data.map(x => `<tr><td>${fmtDate(x.competition_date)}</td><td>${esc(x.name)}<div style="font-size:12px;color:var(--muted)">${esc(x.location || '')}</div></td><td>${esc(x.level || '-')}</td>
      <td><div class="actions"><button class="btn sm" data-res="${x.id}">บันทึกผล</button><button class="btn ghost sm" data-del="${x.id}">ลบ</button></div></td></tr>`).join('') || '<tr><td colspan="4" class="empty">ยังไม่มีรายการ</td></tr>'}
    </tbody></table></div></div>`;
  $('#c-form').onsubmit = async e => {
    e.preventDefault();
    await busy(e.target.querySelector('button'), async () => {
      const { error } = await sb.from('competitions').insert({ name: $('#cp-name').value.trim(), competition_date: $('#cp-date').value, location: $('#cp-loc').value.trim() || null, level: $('#cp-lvl').value || null });
      if (error) return fail(error); toast('เพิ่มรายการแล้ว'); renderApp();
    });
  };
  v.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.res) resultsModal(data.find(x => x.id === b.dataset.res));
    if (b.dataset.del && confirm('ลบรายการนี้และผลการแข่งขันทั้งหมด?')) {
      const { error } = await sb.from('competitions').delete().eq('id', b.dataset.del);
      if (error) return fail(error); toast('ลบแล้ว'); renderApp();
    }
  };
}
async function resultsModal(comp) {
  const [m, r] = await Promise.all([
    sb.from('profiles').select('id, full_name, nickname, birth_date').eq('role', 'student').eq('is_active', true).order('full_name'),
    sb.from('results').select('*, member:profiles(full_name, nickname, birth_date)').eq('competition_id', comp.id).order('placement', { nullsFirst: false })
  ]);
  if (m.error) return fail(m.error); if (r.error) return fail(r.error);
  const cy = Number(comp.competition_date.slice(0, 4));
  const ov = openModal(`ผลการแข่งขัน: ${comp.name}`, `
    <div class="note" style="text-align:left">รุ่นคำนวณตามปีแข่ง ${cy + 543} (ปีแข่ง − ปีเกิด ตามกติกา UIPM)</div>
    <form id="r-form" class="fgrid" style="margin-top:10px">
      <div class="c6 fm"><label for="rs-m">สมาชิก</label><select id="rs-m" required><option value="">เลือก…</option>${m.data.map(p => `<option value="${p.id}">${esc(nameOf(p))} · ${esc(ageGroup(p.birth_date, cy) || 'ไม่มีวันเกิด')}</option>`).join('')}</select></div>
      <div class="c3 fm"><label for="rs-d">ประเภท</label><select id="rs-d">${Object.entries(DISCIPLINES).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="c3"><label for="rs-p">อันดับ</label><input id="rs-p" type="number" inputmode="numeric" min="1" step="1"></div>
      <div class="c3"><label for="rs-s">ผล/คะแนนดิบ</label><input id="rs-s" type="number" inputmode="decimal" step="any"></div>
      <div class="c3 fm"><label for="rs-pt">คะแนนสะสม</label><input id="rs-pt" type="number" inputmode="decimal" step="any" value="0" required></div>
      <div class="c3 fm"><label class="sp" aria-hidden="true">&nbsp;</label><button class="btn gold" type="submit">บันทึก</button></div>
    </form>
    <div class="note" style="text-align:left">คะแนนสะสมของประเภท “รวม” จะถูกนำไปคิดอันดับชมรม · บันทึกซ้ำคนเดิม/ประเภทเดิมจะเป็นการแก้ไข</div>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>ชื่อ</th><th>รุ่น</th><th>ประเภท</th><th>อันดับ</th><th>ผล</th><th>คะแนน</th><th></th></tr></thead><tbody>
    ${r.data.map(x => `<tr><td>${esc(nameOf(x.member || {}))}</td><td>${esc(ageGroup((x.member || {}).birth_date, cy) || '-')}</td><td>${esc(DISCIPLINES[x.discipline])}</td><td>${x.placement ?? '-'}</td><td>${x.score ?? '-'}</td><td>${x.points}</td><td><button class="btn ghost sm" data-rm="${x.id}">ลบ</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">ยังไม่มีผล</td></tr>'}
    </tbody></table></div>`);
  $('#r-form', ov).onsubmit = async e => {
    e.preventDefault();
    await busy(e.target.querySelector('button'), async () => {
      const row = { competition_id: comp.id, member_id: $('#rs-m', ov).value, discipline: $('#rs-d', ov).value,
        placement: $('#rs-p', ov).value ? parseInt($('#rs-p', ov).value, 10) : null, score: $('#rs-s', ov).value !== '' ? Number($('#rs-s', ov).value) : null, points: Number($('#rs-pt', ov).value || 0) };
      const { error } = await sb.from('results').upsert(row, { onConflict: 'competition_id,member_id,discipline' });
      if (error) return fail(error); toast('บันทึกผลแล้ว'); ov.remove(); resultsModal(comp);
    });
  };
  ov.addEventListener('click', async e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    const { error } = await sb.from('results').delete().eq('id', b.dataset.rm);
    if (error) return fail(error); ov.remove(); resultsModal(comp);
  });
}
</script>
</body>
</html>
